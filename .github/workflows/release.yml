name: Release

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  LISPGB_REQUIRE_TEST_ROMS: "1"

permissions:
  contents: write

jobs:
  windows:
    name: リリース（Windows x64）
    if: github.ref_type == 'tag'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: SBCL を導入
        run: |
          choco install sbcl -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'SBCL の導入に失敗しました。' }
          "$env:ProgramFiles/Steel Bank Common Lisp" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: テスト ROM と SDL2 を取得
        run: |
          ./scripts/fetch_test_roms.ps1
          ./scripts/fetch_sdl2.ps1
      - name: 全テストとビルド
        run: |
          ./scripts/test.ps1
          ./scripts/build.ps1
          ./scripts/smoke.ps1
      - name: SDL の描画とイベントを検証
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./scripts/smoke_sdl.ps1
      - name: 配布物を作成して展開後を検証
        run: |
          ./scripts/package_zip.ps1
          ./scripts/verify_windows_package.ps1
      - name: GitHub Releases へ添付
        uses: softprops/action-gh-release@v3
        with:
          files: dist/LispGB-*-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
  linux:
    name: リリース（Ubuntu 24.04 ${{ matrix.arch }}）
    # 手動実行でもタグを選択した場合だけ公開する。
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            artifact_arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 依存を導入
        run: sudo apt-get update && sudo apt-get install -y sbcl libsdl2-dev curl zip
      - name: テスト ROM を取得
        run: sh scripts/fetch_test_roms.sh
      - name: 全テスト
        run: sh scripts/test.sh
      - name: 実行ファイルをビルド
        run: sh scripts/build.sh
      - name: バージョンとヘッドレス120フレームを検証
        run: sh scripts/smoke.sh
      - name: 配布物を作成
        run: sh scripts/package_zip.sh
      - name: GitHub Releases へ添付
        uses: softprops/action-gh-release@v3
        with:
          files: dist/LispGB-*-linux-${{ matrix.artifact_arch }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
  macos:
    name: リリース（macOS 15 ${{ matrix.arch }}）
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_arch: apple-silicon
            runner: macos-15
          - arch: amd64
            artifact_arch: intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 依存を導入
        run: brew install sbcl sdl2
      - name: テスト ROM を取得
        run: sh scripts/fetch_test_roms.sh
      - name: 全テスト
        run: sh scripts/test.sh
      - name: 実行ファイルをビルド
        run: sh scripts/build.sh
      - name: バージョンとヘッドレス120フレームを検証
        run: sh scripts/smoke.sh
      - name: 配布物を作成
        run: sh scripts/package_zip.sh
      - name: 配布物の CPU と展開後の実行を検証
        run: sh scripts/verify_macos_package.sh "${{ matrix.arch }}"
      - name: GitHub Releases へ添付
        uses: softprops/action-gh-release@v3
        with:
          files: dist/LispGB-*-macos-${{ matrix.artifact_arch }}.zip
          fail_on_unmatched_files: true
