name: Release

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-arm64:
    name: リリース（Ubuntu 24.04 arm64）
    # 手動実行でもタグを選択した場合だけ公開する。
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 依存を導入
        run: sudo apt-get update && sudo apt-get install -y sbcl libsdl2-dev curl zip
      - name: テスト ROM を取得
        run: sh scripts/fetch_test_roms.sh
      - name: 全テスト
        run: sh scripts/test.sh
      - name: 実行ファイルをビルド
        run: sh scripts/build.sh
      - name: バージョンとヘッドレス120フレームを検証
        run: sh scripts/smoke.sh
      - name: 配布物を作成
        run: sh scripts/package_zip.sh
      - name: GitHub Releases へ添付
        uses: softprops/action-gh-release@v3
        with:
          files: dist/LispGB-*-linux-arm64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
