name: CI Linux

"on":
  push:
    branches: [main]
    paths:
      - 'lispgb.asd'
      - 'src/**'
      - 'tests/**'
      - 'scripts/fetch_test_roms.sh'
      - 'scripts/test.sh'
      - 'scripts/build.sh'
      - 'scripts/smoke.sh'
      - 'scripts/package_zip.sh'
      - 'scripts/get_version.sh'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lispgb.asd'
      - 'src/**'
      - 'tests/**'
      - 'scripts/fetch_test_roms.sh'
      - 'scripts/test.sh'
      - 'scripts/build.sh'
      - 'scripts/smoke.sh'
      - 'scripts/package_zip.sh'
      - 'scripts/get_version.sh'
      - '.github/workflows/ci-linux.yml'
  workflow_dispatch:

env:
  LISPGB_REQUIRE_TEST_ROMS: "1"

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: テストとビルド（Ubuntu 24.04 ${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            artifact_arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 依存を導入
        run: sudo apt-get update && sudo apt-get install -y sbcl libsdl2-dev curl zip
      - name: テスト ROM を取得
        run: sh scripts/fetch_test_roms.sh
      - name: 全テスト
        run: sh scripts/test.sh
      - name: 実行ファイルをビルド
        run: sh scripts/build.sh
      - name: バージョンとヘッドレス120フレームを検証
        run: sh scripts/smoke.sh
      - name: 配布物を作成
        run: sh scripts/package_zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: LispGB-linux-${{ matrix.artifact_arch }}
          path: dist/LispGB-*-linux-${{ matrix.artifact_arch }}.zip
          if-no-files-found: error
